[package]
name = "floti-host"
version = "0.1.0"
description = "The Floti host: sessions in ptys, their screens and the store, served to clients on a local socket"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "floti"

[lib]
name = "floti_host"
path = "src/lib.rs"

# The one executable Floti ships: `floti host` is the daemon.
[[bin]]
name = "floti"
path = "src/main.rs"

# The fake agent CLI the host's tests launch instead of a real agent. Built
# with the crate so integration tests reach it through
# CARGO_BIN_EXE_floti-fake-agent; nothing ships it.
[[bin]]
name = "floti-fake-agent"
path = "testkit/fake_agent.rs"
test = false
doc = false

# A program with no console on Windows, which the fake agent starts as a
# child for `--fake-gui-child`. Built beside it for the same tests; nothing
# ships it.
[[bin]]
name = "floti-fake-gui"
path = "testkit/fake_gui.rs"
test = false
doc = false

# The program plugin tests' manifests name in `exec`. Built beside the fake
# agent for the same tests; nothing ships it.
[[bin]]
name = "floti-fake-program"
path = "testkit/fake_program.rs"
test = false
doc = false

[features]
# Test support (temporary folders, unique socket names, the fake agent's
# backend and records) for the crate's integration tests. The crate turns it
# on for its own tests through the dev-dependency below.
testkit = ["dep:tempfile"]

[dependencies]
alacritty_terminal.workspace = true
ammonia.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
ciborium.workspace = true
comrak.workspace = true
deno_core.workspace = true
deno_error.workspace = true
flate2.workspace = true
floti-protocol.workspace = true
getrandom.workspace = true
html5ever.workspace = true
jiff.workspace = true
notify.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
syntect.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
two-face.workspace = true
url.workspace = true

# Only the per-OS implementations under src/platform use these.
[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[dev-dependencies]
floti-host = { path = ".", features = ["testkit"] }
