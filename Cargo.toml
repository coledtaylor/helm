# The Rust half of the repository: the Floti host and the protocol its clients
# speak. The JavaScript half (packages/) is a pnpm workspace and knows nothing
# of this file.
[workspace]
members = ["crates/*"]
resolver = "3"

# No debug info for dependencies in dev and test builds. Full debug info for
# every crate made each test binary carry its own copy of every dependency's
# symbols (hundreds of MB of PDBs on Windows), and the target folder grew past
# 10 GB. Our own crates keep full debug info, so stepping through and
# backtraces in Floti's code are unchanged.
[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26"
# The Files view's sanitiser: rendered markdown keeps no script, event handler
# or address it does not allow.
ammonia = "4"
# A plugin's rail icon, inlined as a data: URL.
base64 = "=0.22.1"
# Seals plugin secrets under a key the OS keeps for this user.
chacha20poly1305 = "=0.10.1"
ciborium = "0.2"
# GitHub-flavoured markdown for the Files view, without the CLI or its own
# highlighter: code fences go through syntect below.
comrak = { version = "0.59", default-features = false }
# Plugin background scripts: one V8 isolate each, with no extension of
# deno's beyond the core, so a script can do only what the host gives it.
deno_core = "=0.413.0"
# The error type a plugin isolate's ops throw: the version deno_core uses.
deno_error = "=0.7.1"
floti-protocol = { path = "crates/floti-protocol" }
getrandom = "0.4"
# Raw deflate for archived transcript bodies, on the pure-Rust backend so no OS
# needs a C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Parses the sanitiser's output back into a tree, so the Files view's own
# transforms run after it. The version ammonia uses.
html5ever = "0.40"
# Local midnight in the host's own timezone. Default features: Windows bundles
# the tz database, Unix reads the system zoneinfo.
jiff = "0.2"
# Directory junctions, which Windows lets any user make, where a symlink needs
# elevation or developer mode.
junction = "1.4"
libc = "0.2"
# Recursive folder watching for the Files view, on each OS's own events.
notify = "8"
portable-pty = "0.9"
# floti.fetch's transport: rustls with ring (no C toolchain beyond the
# compiler, and a static Linux binary), the system proxy, and no cookies,
# cache or redirects of its own. The host follows each redirect itself.
reqwest = { version = "=0.13.5", default-features = false, features = [
    "http2",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "=0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Bundled, so the host needs no SQLite on the machine and every OS runs the
# same version.
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
# Floti's own secrets on Linux: the Secret Service over D-Bus, in pure Rust
# so the binary stays static.
secret-service = { version = "=5.2.0", features = ["rt-tokio-crypto-rust"] }
# Floti's own secrets on macOS: the Keychain.
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# Profiles, templates and harness manifests are YAML. A maintained fork of
# serde_yaml, which is no longer maintained.
serde_yaml_ng = "0.10"
# Code highlighting with the pure-Rust regex engine, so no OS needs Oniguruma.
# Its themes are syntect's own; its grammars are two-face's below.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's grammar set on top of syntect's, so TypeScript, TSX, PowerShell, TOML,
# Dockerfile, INI and the rest of the languages the Files view highlights
# today each have their own grammar. On the same pure-Rust regex engine.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
# WHATWG URLs, for a plugin isolate's URL and URLSearchParams.
url = "=2.5.8"
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
