# The Rust half of the repository: the Floti host and the protocol its clients
# speak. The JavaScript half (packages/) is a pnpm workspace and knows nothing
# of this file.
[workspace]
members = ["crates/*"]
resolver = "3"

# No debug info for dependencies in dev and test builds. Full debug info for
# every crate made each test binary carry its own copy of every dependency's
# symbols (hundreds of MB of PDBs on Windows), and the target folder grew past
# 10 GB. Our own crates keep full debug info, so stepping through and
# backtraces in Floti's code are unchanged.
[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26"
# The Files view's sanitiser: rendered markdown keeps no script, event handler
# or address it does not allow.
ammonia = "4"
bytes = "1"
ciborium = "0.2"
# GitHub-flavoured markdown for the Files view, without the CLI or its own
# highlighter: code fences go through syntect below.
comrak = { version = "0.59", default-features = false }
floti-protocol = { path = "crates/floti-protocol" }
getrandom = "0.4"
# The agent tools listener's HTTP: HTTP/1.1 only, on loopback, with no TLS.
http = "1"
http-body-util = "0.1"
# Raw deflate for archived transcript bodies, on the pure-Rust backend so no OS
# needs a C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Parses the sanitiser's output back into a tree, so the Files view's own
# transforms run after it. The version ammonia uses.
html5ever = "0.40"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Local midnight in the host's own timezone. Default features: Windows bundles
# the tz database, Unix reads the system zoneinfo.
jiff = "0.2"
# Directory junctions, which Windows lets any user make, where a symlink needs
# elevation or developer mode.
junction = "1.4"
libc = "0.2"
# Recursive folder watching for the Files view, on each OS's own events.
notify = "8"
portable-pty = "0.9"
# The MCP protocol of the agent tools listener: its server side over
# streamable HTTP, without the macros or a client.
rmcp = { version = "3.8", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
# Bundled, so the host needs no SQLite on the machine and every OS runs the
# same version.
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# Profiles, templates and harness manifests are YAML. A maintained fork of
# serde_yaml, which is no longer maintained.
serde_yaml_ng = "0.10"
# The Noise sessions every client connection runs, never hand-rolled. Only the
# pure-Rust primitives Noise_IK_25519_ChaChaPoly_BLAKE2s needs: its `std`
# feature would pull in ring's C and assembly, and snow needs only `alloc`.
snow = { version = "0.10", default-features = false, features = [
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
# Constant-time comparison of the agent tools listener's bearer tokens.
subtle = "2"
# Code highlighting with the pure-Rust regex engine, so no OS needs Oniguruma.
# Its themes are syntect's own; its grammars are two-face's below.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's grammar set on top of syntect's, so TypeScript, TSX, PowerShell, TOML,
# Dockerfile, INI and the rest of the languages the Files view highlights
# today each have their own grammar. On the same pure-Rust regex engine.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
# Wipes a private key's bytes when it is dropped. The version snow's own
# ciphers already use.
zeroize = "1"
