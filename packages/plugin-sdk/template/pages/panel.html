<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Panel</title>
    <link rel="stylesheet" href="style.css" />
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main class="page">
      <p class="helm-caps">My plugin</p>
      <p>A panel in Helm's sidebar. Helm draws the header above it, with the + action from the manifest.</p>
      <button type="button" class="helm-button" data-variant="primary" id="open">Open a tab</button>
      <hr class="helm-rule" />
      <ul class="helm-list" id="opened"></ul>
      <p class="helm-meta" id="where"></p>
    </main>
  </body>
</html>
