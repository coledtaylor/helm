<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page background plugin pages run in (`main/plugins/background.ts`):
         never shown, and nothing in it but their frames and the relay that
         answers them. It reaches nothing but its own scripts and the
         `helm-plugin:` frames; `connect-src` is Vite's dev server, as in
         index.html. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: http://localhost:*; frame-src helm-plugin:"
    />
    <title>Helm plugin host</title>
  </head>
  <body>
    <div id="frames"></div>
    <script type="module" src="./src/pluginHost/main.ts"></script>
  </body>
</html>
