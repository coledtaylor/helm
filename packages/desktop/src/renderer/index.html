<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The renderer loads nothing it did not ship with: no remote scripts, no
         inline handlers, no eval. Vite's dev server needs its own origin and a
         websocket for HMR, which is what `connect-src` allows.

         `frame-src helm-content:` is the content viewer's HTML artifacts, and
         it is the narrowest thing that could be written here: that scheme
         is served by the main process from a directory pinned to a token, under
         a policy of its own with `default-src 'none'` in it, into an iframe
         with no `allow-same-origin`. Widening `default-src` instead would have
         let the app itself reach the same URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*; frame-src helm-content:"
    />
    <title>Helm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
