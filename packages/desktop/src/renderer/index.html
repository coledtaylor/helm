<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The renderer loads nothing it did not ship with: no remote scripts, no
         inline handlers, no eval. Vite's dev server needs its own origin and a
         websocket for HMR, which is what `connect-src` allows. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>Helm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
