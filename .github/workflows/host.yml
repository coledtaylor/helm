name: Host

# The Rust host and its protocol crate, on every OS the host runs on. Kept
# apart from ci.yml, which checks the Electron app with pnpm: this workflow
# needs the Rust toolchain and Node (an agent backend's tests run its fake
# CLI from test/fake-agents), and a change that touches neither crate nor
# what they embed does not run it.
on:
  # The two path lists are the same; keep them so.
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      # The store embeds today's migrations at compile time.
      - "packages/core/drizzle/**"
      # The plugin registry embeds the SDK's manifest validator at compile time.
      - "packages/plugin-sdk/src/manifest.js"
      # The protocol's catalogue test reads the app's channel list.
      - "packages/desktop/src/shared/ipc.ts"
      # The agent backends' tests run these fake CLIs.
      - "test/fake-agents/**"
      # The remote and WSL tests run these fake transports.
      - "test/fake-ssh/**"
      # The step after the tests runs this.
      - "scripts/test-leftovers.mjs"
      - ".github/workflows/host.yml"
      - ".config/nextest.toml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/core/drizzle/**"
      - "packages/plugin-sdk/src/manifest.js"
      - "packages/desktop/src/shared/ipc.ts"
      - "test/fake-agents/**"
      - "test/fake-ssh/**"
      - "scripts/test-leftovers.mjs"
      - ".github/workflows/host.yml"
      - ".config/nextest.toml"

concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      # Each OS reports on its own: a failure on one does not cancel the others.
      fail-fast: false
      matrix:
        # Standard GitHub-hosted runners only.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # The Rust version and its components live in rust-toolchain.toml, and
      # nowhere else: rustup installs exactly what that file names, so CI
      # lints and tests with the toolchain a local cargo uses.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2

      # The v8 crate's build script downloads V8 as a static library into
      # target/debug/gn_out, outside what rust-cache keeps: its cache brings
      # back the build script's output, which names that folder, without the
      # library in it, and compiling v8 then fails with "could not find native
      # static library rusty_v8". The folder is cached on its own (this step's
      # save runs before rust-cache prunes), and when the library is still
      # missing, v8 is cleaned so its build script runs and fetches it again.
      - name: Cache V8's static library
        uses: actions/cache@v4
        with:
          path: target/debug/gn_out
          key: rusty-v8-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rusty-v8-${{ runner.os }}-

      - name: Fetch V8 again when its static library is missing
        shell: bash
        run: |
          if [ ! -f target/debug/gn_out/obj/rusty_v8.lib ] && [ ! -f target/debug/gn_out/obj/librusty_v8.a ]; then
            cargo clean -p v8
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # nextest runs each test in a process of its own and ends a hung one by
      # name (.config/nextest.toml). Pinned, so a new release cannot change
      # how the suite runs between two pushes.
      - uses: taiki-e/install-action@v2.87.33
        with:
          tool: cargo-nextest@0.9.150

      # What is running and which test temp folders exist before the tests, so
      # the step after them reports only what they left (docs/TESTING.md).
      - name: Snapshot processes and temp folders
        run: node scripts/test-leftovers.mjs before "${{ runner.temp }}/leftovers-host.json"

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --doc --workspace --locked

      # A test leaves nothing behind. This fails the job naming each test temp
      # folder the tests left and each process they started that is still
      # alive.
      - name: Nothing left behind by the tests
        run: node scripts/test-leftovers.mjs after "${{ runner.temp }}/leftovers-host.json"
