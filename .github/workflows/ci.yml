name: CI

on:
  # `main` is deliberately absent. Every push to `main` runs `Release`, which
  # calls this workflow as its gate - so `main` is checked exactly once per
  # push rather than twice. A second run of the same commit on the same three
  # runners would buy nothing.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  # Scoped by workflow as well as ref. Called from `Release`, this workflow
  # sees the *caller's* `github.workflow`, so the release gate does not share a
  # cancellation group with anything else that might run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs the gate - `pnpm check`: typecheck, lint, unit and integration tests -
# on Windows, macOS and Linux, then builds. Once work happens on a Mac, nothing
# else would run the Windows code paths, and the reverse. The end-to-end tier
# (`pnpm test:e2e`) stays local (docs/TESTING.md).
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One OS failing must not cancel the others: each job runs to the end and
      # reports its own result.
      fail-fast: false
      matrix:
        include:
          # All three are required: a failure on any one fails this workflow,
          # and from `Release` that skips the tag, the release and the SDK
          # publish. A runner can be made advisory again by setting its flag to
          # false.
          - os: windows-latest
            required: true
          - os: macos-latest
            required: true
          - os: ubuntu-latest
            required: true

    # A job whose flag is false would still show as failed, with its output,
    # but count as a success to the workflow and to `needs:` in release.yml.
    continue-on-error: ${{ !matrix.required }}

    # A hung pty test must not hold a runner for the six-hour default.
    timeout-minutes: 30

    steps:
      # GitHub's Windows runners check out with core.autocrlf=true; developers
      # work on LF bytes (there is no .gitattributes). Without this, Windows
      # would lint and test files no developer has. A no-op on macOS and Linux.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # No `version:` - the action reads `packageManager` from package.json.
        # A number written here is a second place for the pinned pnpm to live,
        # and the two drifting is exactly the class of toolchain mismatch
        # scripts/dist-win.mjs exists to catch.

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # What is running and which test temp folders exist before the check, so
      # the step after it reports only what the check left (docs/TESTING.md).
      - name: Snapshot processes and temp folders
        run: node scripts/test-leftovers.mjs before "${{ runner.temp }}/leftovers-check.json"

      # One step, not three: the gate has one definition, in package.json, and
      # CI runs exactly what a developer runs.
      - name: Check (typecheck, lint, unit and integration tests)
        run: pnpm check

      # A test leaves nothing behind. This fails the job naming each test temp
      # folder the check left and each process it started that is still alive.
      - name: Nothing left behind by the check
        run: node scripts/test-leftovers.mjs after "${{ runner.temp }}/leftovers-check.json"

      - name: Build
        run: pnpm build
