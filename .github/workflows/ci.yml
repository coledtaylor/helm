name: CI

on:
  # `main` is deliberately absent. Every push to `main` runs `Release`, which
  # calls this workflow as its gate - so `main` is checked exactly once per
  # push rather than twice. Windows minutes bill at 2x on a private repo, and
  # two identical 8-minute runs of the same commit buy nothing.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  # Scoped by workflow as well as ref. Called from `Release`, this workflow
  # sees the *caller's* `github.workflow`, so the release gate does not share a
  # cancellation group with anything else that might run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Helm is Windows-first (CLAUDE.md): junctions rather than symlinks, ConPTY,
    # paths with spaces. Checking it on Linux would pass while missing the
    # platform every one of those decisions was made for.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # No `version:` - the action reads `packageManager` from package.json.
        # A number written here is a second place for the pinned pnpm to live,
        # and the two drifting is exactly the class of toolchain mismatch
        # scripts/dist-win.mjs exists to catch.

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          if-no-files-found: ignore
